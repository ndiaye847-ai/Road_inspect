apply plugin: 'com.android.application'

apply plugin: 'checkstyle'

check.dependsOn 'checkstyle'
checkstyle {
    toolVersion = '10.12.4'
}
checkstyle.configProperties.config_loc = checkstyle.configFile.parentFile
task checkstyle(type: Checkstyle) {
    configFile file("config/checkstyle/checkstyle.xml")
    source 'src'
    include '**/*.java'
    exclude '**/gen/**'

    classpath = files()
}
def env = System.getenv()
def number = env['BUILD_NUMBER']
def final_number = 10 + (number as Integer ?: 0)

//def env_fake_speed = System.getProperties().getProperty('FAKE_SPEED')
//def String fake_speed = "true".equals(env_fake_speed) ? "true" : "false";

android {
    namespace "com.softteco.roadlabpro"
    compileSdk 34

    // Apache HTTP client classes (org.apache.http.*) were removed from the public
    // SDK in API 23+; HockeySender.java still uses them (dead code - HockeyApp
    // itself shut down in 2019). This restores compile-time access without a rewrite.
    useLibrary 'org.apache.http.legacy'

    // AGP 8 stopped generating BuildConfig by default; this project's code
    // (buildConfigField below, BuildConfig.FAKE, BuildConfig.GOOGLE_CLIENT_ID/
    // SECRET in GoogleAPIHelper.java) needs it explicitly turned back on, or
    // the build fails with "cannot find symbol BuildConfig".
    buildFeatures {
        buildConfig true
    }

    lintOptions {
        disable 'InvalidPackage'
        abortOnError true
    }

    packagingOptions {
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/LICENSE'
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def apk = output.outputFile
            def newName = "RoadLabPro_v${versionName}.apk"
            output.outputFile = new File(apk.parent, newName)
        }
    }

    // Original keystore and hardcoded credentials removed for security.
    // Generate your own keystore (`keytool -genkey ...`) and supply these
    // via local.properties / environment variables instead of committing them.
    signingConfigs {
        debug {
            storeFile file(System.getenv("DEBUG_KEYSTORE_FILE") ?: "keystore/debug.jks")
            storePassword System.getenv("DEBUG_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("DEBUG_KEY_ALIAS") ?: ""
            keyPassword System.getenv("DEBUG_KEY_PASSWORD") ?: ""
        }
        release {
            storeFile file(System.getenv("RELEASE_KEYSTORE_FILE") ?: "keystore/release.jks")
            storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: ""
            keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: ""
        }
    }

    productFlavors {
        fakeSpeed {
            //versionName "1." + final_number + ("true".equals(fake_speed) ? ".f" : "")
            //println "fakeSpeed: " + fake_speed
            //println "versionName: " + versionName
            //buildConfigField "Boolean", "FAKE", fake_speed;
            versionName "1." + final_number + ".f"
            buildConfigField "Boolean", "FAKE", "true";
        }
        defaultConfig {
            buildConfigField "Boolean", "FAKE", "false";
        }
    }

    defaultConfig {
        applicationId "com.softteco.roadlabpro"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode final_number as Integer ?: 0
        versionName "1." + final_number

        // Original OAuth credentials removed for security.
        // Provide your own via environment variables (never commit real values).
        buildConfigField "String", "GOOGLE_CLIENT_ID", "\"${env['GOOGLE_CLIENT_ID'] ?: ''}\""
        buildConfigField "String", "GOOGLE_CLIENT_SECRET", "\"${env['GOOGLE_CLIENT_SECRET'] ?: ''}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'src/libs', include: ['*.jar'])

    // UNVERIFIED: these two libraries were never republished to Maven Central or
    // Google's Maven after JCenter shut down in 2022. This session could not reach
    // jitpack.io to confirm exact available tags/coordinates (network-restricted) -
    // verify on https://jitpack.io/#JoanZapata/Android-PdfView and
    // https://jitpack.io/#nostra13/Android-Universal-Image-Loader before building.
    implementation 'com.github.JoanZapata:android-pdfview:1.0.4'
    implementation 'com.github.nostra13:Android-Universal-Image-Loader:1.9.5'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.annotation:annotation:1.8.2'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // play-services-drive and play-services-location were declared in the original
    // project but never actually referenced anywhere in the source (Drive access is
    // done through plain REST calls via Retrofit, and location through the native
    // android.location APIs) - dropped as dead dependencies during this migration.
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    implementation 'com.androidplot:androidplot-core:1.5.11'
    implementation 'com.dropbox.core:dropbox-core-sdk:5.4.6'

    // OkHttp is now a transitive dependency of Retrofit (okhttp3); the old
    // com.squareup.okhttp:okhttp:2.4.0 dependency was removed.

    implementation 'com.opencsv:opencsv:5.9'
    implementation 'commons-io:commons-io:2.16.1'
    implementation project(":simplekml")
}
